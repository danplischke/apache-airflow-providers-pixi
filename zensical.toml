[project]
site_name = "apache-airflow-providers-pixi"
site_description = "Apache Airflow 3 provider to run Python callables in Pixi environments."
site_author = "Dan Plischke"
site_url = "https://danplischke.github.io/apache-airflow-providers-pixi/"
repo_url = "https://github.com/danplischke/apache-airflow-providers-pixi"
repo_name = "danplischke/apache-airflow-providers-pixi"
edit_uri = "edit/main/docs/"
copyright = """
Copyright &copy; Dan Plischke. Licensed under the MIT License.<br>
Apache Airflow, Apache, Airflow and the Airflow logo are trademarks of The Apache Software Foundation.
This project is not affiliated with or endorsed by The Apache Software Foundation.
"""

nav = [
  { "Basics" = [
    { "Home" = "index.md" },
    { "Changelog" = "changelog.md" },
    { "Security" = "security.md" },
  ] },
  { "Guides" = [
    { "Connection types" = [
      { "Pixi Connection" = "connections/pixi.md" },
    ] },
    { "Pixi Operator" = "operators/pixi.md" },
    { "Pixi Task Decorator" = "decorators/pixi.md" },
    { "Pixi Bash Operator" = "operators/bash.md" },
    { "Pixi Project Task Operator" = "operators/project_task.md" },
    { "Pixi Kubernetes Pod Operator" = "operators/kubernetes.md" },
    { "Pixi Docker Operator" = "operators/docker.md" },
    { "Pixi External Python Operator" = "operators/external.md" },
    { "Pixi Branch and Short Circuit Operators" = "operators/branch.md" },
    { "Pixi Sensor" = "sensors/pixi.md" },
    { "Deployment" = "deployment.md" },
    { "Building on the Pixi Operator" = "extending.md" },
  ] },
  { "References" = [
    { "Python API" = "api.md" },
  ] },
  { "System tests" = [
    { "System Tests" = "system-tests.md" },
  ] },
  { "Resources" = [
    { "PyPI Repository" = "https://pypi.org/project/apache-airflow-providers-pixi/" },
    { "Installing from sources" = "installing-from-sources.md" },
  ] },
  { "Commits" = [
    { "Detailed list of commits" = "https://github.com/danplischke/apache-airflow-providers-pixi/commits/main/" },
  ] },
]

extra_css = ["stylesheets/airflow.css"]

[project.theme]
variant = "classic"
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/wind"
repo = "fontawesome/brands/github"

[project.theme.font]
text = "Roboto"
code = "Roboto Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/danplischke/apache-airflow-providers-pixi"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/apache-airflow-providers-pixi/"

[project.plugins.llmstxt]
full_output = "llms-full.txt"
markdown_description = """
Apache Airflow 3 provider that runs Python callables, Bash commands, manifest tasks, branch choices and
sensor checks inside [Pixi](https://pixi.sh) environments, on the worker or in a Kubernetes pod. Install with
`pip install apache-airflow-providers-pixi` (add the `[cncf.kubernetes]` extra for the pod operator);
it needs Apache Airflow 3.1.2 or newer, and the workers need pixi 0.81.0 or newer, which the provider
never installs itself. An environment is a
Pixi project (`pixi_project_path`), a manifest file (`pixi_toml_path`), or an inline manifest
(`dependencies`, `pypi_dependencies`). Functions are shipped as source, so they must
be self-contained: imports inside the function, no variables from enclosing functions.
"""

[project.plugins.llmstxt.sections]
Basics = [
  { "index.md" = "Installation, requirements and a quick start" },
  { "changelog.md" = "Changes per release" },
  { "security.md" = "Security considerations: installing pixi, run-time dependency resolution, pickle, caches, credentials" },
]
Guides = [
  { "connections/pixi.md" = "The pixi connection type: credentials for private conda channels and PyPI indexes" },
  { "operators/pixi.md" = "PixiOperator: choosing the environment, the lock file, platforms, inline manifests, arguments, the Airflow context, return values, errors, environment variables from Variables and Connections, logs, timeouts, cache directories" },
  { "decorators/pixi.md" = "@task.pixi and how to write a function that is shipped to the environment" },
  { "operators/bash.md" = "PixiBashOperator and @task.pixi_bash: Bash commands with pixi run, and their environment variables" },
  { "operators/project_task.md" = "PixiProjectTaskOperator: run a [tasks] entry of a pixi manifest with pixi run <task> [args]" },
  { "operators/kubernetes.md" = "PixiKubernetesPodOperator and @task.pixi_kubernetes: Pixi environments in Kubernetes pods, deferrable mode, size limits, errors" },
  { "operators/docker.md" = "PixiDockerOperator and @task.pixi_docker: Pixi environments in Docker containers, the image, size limits, errors" },
  { "operators/external.md" = "PixiExternalPythonOperator and @task.pixi_external: run with the Python of an environment installed at image build time, without pixi" },
  { "operators/branch.md" = "PixiBranchOperator, PixiShortCircuitOperator, @task.pixi_branch and @task.pixi_short_circuit: choose or skip downstream tasks with a callable in a Pixi environment" },
  { "sensors/pixi.md" = "PixiSensor and @task.pixi_sensor: sensor checks inside a Pixi environment" },
  { "deployment.md" = "Deploying: pixi in the worker image, shared caches, env_cache_path, projects in DAG bundles, private channels, pods" },
  { "extending.md" = "Building other providers' operators and decorators on the Pixi base classes" },
]
"Development" = [
  { "system-tests.md" = "Example DAGs and how to run the unit, integration and system tests" },
  { "installing-from-sources.md" = "Installing from sources, the local Airflow, building the docs, the CI Airflow matrix and the release process" },
]
Optional = [
  { "api.md" = "Python API reference of every operator, sensor, decorator, hook, exception and base class" },
]

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
inventories = [
  "https://docs.python.org/3/objects.inv",
  "https://airflow.apache.org/docs/apache-airflow/stable/objects.inv",
  "https://airflow.apache.org/docs/task-sdk/stable/objects.inv",
]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "sphinx"
docstring_section_style = "list"
filters = ["!^_"]
heading_level = 2
members_order = "source"
merge_init_into_class = true
line_length = 88
separate_signature = true
show_root_full_path = true
show_root_heading = true
show_signature_annotations = true
show_source = true
show_symbol_type_heading = true
show_symbol_type_toc = true
relative_crossrefs = true
scoped_crossrefs = true
signature_crossrefs = true

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = "¶"
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.smartsymbols = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.snippets.dedent_subsections = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
