name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  PYTHON_VERSION_DEFAULT: "3.14"

jobs:
  qa:
    name: QA
    uses: ./.github/workflows/qa.yml

  check-version:
    name: Check tag matches version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — https://github.com/actions/checkout/releases/tag/v7.0.1

      - name: Compare the tag with provider.yaml and the changelog
        run: |
          provider=$(awk '/^versions:/ { getline; sub(/^ *- */, ""); print; exit }' provider.yaml)
          changelog=$(sed -n 's/^## //p' docs/changelog.md | head -1)
          if [ "v${provider}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error file=provider.yaml::Tag ${GITHUB_REF_NAME} does not match the newest version ${provider} in provider.yaml"
            exit 1
          fi
          if [ "v${changelog}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error file=docs/changelog.md::Tag ${GITHUB_REF_NAME} does not match the newest section ${changelog} in docs/changelog.md"
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches version ${provider}"

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [qa, check-version]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 — https://github.com/actions/setup-python/releases/tag/v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 — https://github.com/astral-sh/setup-uv/releases/tag/v10.2.0

      - name: Build package
        run: uv build

      - name: Compare the built version with the tag
        run: |
          wheel=$(unzip -p dist/*.whl '*.dist-info/METADATA' | sed -n 's/^Version: //p')
          pkg_info=$(tar -tzf dist/*.tar.gz | grep '^[^/]*/PKG-INFO$')
          sdist=$(tar -xzOf dist/*.tar.gz "${pkg_info}" | sed -n 's/^Version: //p')
          if [ "v${wheel}" != "${GITHUB_REF_NAME}" ] || [ "v${sdist}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the built wheel ${wheel} and sdist ${sdist}"
            exit 1
          fi
          echo "Built ${wheel} for tag ${GITHUB_REF_NAME}"

      - name: Check package
        # twine < 7 rejects newer Metadata-Version values that PyPI accepts.
        run: |
          pip install 'twine>=7.0.0'
          twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 — https://github.com/actions/upload-artifact/releases/tag/v7.0.1
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 — https://github.com/actions/download-artifact/releases/tag/v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 — https://github.com/pypa/gh-action-pypi-publish/releases/tag/v1.14.2

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-pypi]
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 — https://github.com/actions/download-artifact/releases/tag/v8.0.1
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes
