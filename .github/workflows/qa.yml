name: QA Check

on:
  push:
    branches: [main]
  # No paths filter: "QA result" is a required check, so the workflow must run on every PR.
  # The changes job skips what a PR doesn't touch instead.
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION_DEFAULT: "3.14"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      lint: ${{ steps.filter.outputs.lint }}
      unit: ${{ steps.filter.outputs.unit }}
      compat: ${{ steps.filter.outputs.compat }}
      smoke: ${{ steps.filter.outputs.smoke }}
      integration: ${{ steps.filter.outputs.integration }}
      system: ${{ steps.filter.outputs.system }}
      package: ${{ steps.filter.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — https://github.com/actions/checkout/releases/tag/v7.0.1
        if: github.event_name == 'pull_request'
        with:
          # the PR's merge commit and its first parent, the base branch
          fetch-depth: 2

      - name: Match changed files
        id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only HEAD^1 HEAD)
            printf 'Changed files:\n%s\n' "$files"
            match() { printf '%s\n' "$files" | grep -qE "$1" && echo true || echo false; }
          else
            match() { echo true; }
          fi
          src='^(src/|pyproject\.toml$|uv\.lock$|provider\.yaml$|\.github/workflows/qa\.yml$)'
          {
            echo "lint=$(match "$src|^(tests|dev)/.*\.py$")"
            echo "unit=$(match "$src|^tests/(unit/|conftest\.py$)")"
            echo "compat=$(match "$src|^tests/")"
            echo "smoke=$(match "$src|^dev/smoke\.py$")"
            echo "integration=$(match "$src|^tests/(integration/|conftest\.py$)")"
            echo "system=$(match "$src|^tests/(system/|conftest\.py$)")"
            echo "package=$(match "$src|^(tests/|dev/dags/|docs/changelog\.md$|README\.md$|LICENSE$)")"
          } | tee -a "$GITHUB_OUTPUT"

  lint:
    name: Lint & Format Check
    needs: [changes]
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — https://github.com/actions/checkout/releases/tag/v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 — https://github.com/actions/setup-python/releases/tag/v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 — https://github.com/astral-sh/setup-uv/releases/tag/v10.2.0

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run ruff linter
        run: uv run ruff check src tests dev --output-format=github

      - name: Run ruff format check
        run: uv run ruff format src tests dev --check

      - name: Type check the runtime
        run: uv run mypy

  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    needs: [changes]
    if: needs.changes.outputs.unit == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # requires-python is >=3.10, so the oldest supported version is exercised too.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # Airflow does not support Windows, so macOS is the only extra platform.
          - os: macos-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — https://github.com/actions/checkout/releases/tag/v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 — https://github.com/actions/setup-python/releases/tag/v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 — https://github.com/astral-sh/setup-uv/releases/tag/v10.2.0

      - name: Install dependencies
        run: uv sync --locked --group dev --python ${{ matrix.python-version }}

      - name: Run unit tests with coverage
        run: uv run pytest tests/unit -v --cov=src/airflow/providers/pixi --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1 — https://github.com/codecov/codecov-action/releases/tag/v7.1.1
        with:
          files: coverage.xml
          fail_ci_if_error: false
          verbose: true

  compat:
    name: Airflow ${{ matrix.airflow-version }} (official constraints)
    needs: [changes]
    if: needs.changes.outputs.compat == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        airflow-version: ["3.1.8", "3.2.2", "3.3.2"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — https://github.com/actions/checkout/releases/tag/v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 — https://github.com/actions/setup-python/releases/tag/v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 — https://github.com/astral-sh/setup-uv/releases/tag/v10.2.0

      - name: Install Airflow with its constraints
        env:
          AIRFLOW_VERSION: ${{ matrix.airflow-version }}
        run: |
          uv venv --python 3.12
          uv pip install "apache-airflow==${AIRFLOW_VERSION}" apache-airflow-providers-standard \
            apache-airflow-providers-cncf-kubernetes apache-airflow-providers-docker \
            apache-airflow-providers-common-compat \
            pytest pyyaml jsonschema tomlkit "packaging>=22" \
            -c "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-3.12.txt"
          uv pip install --no-deps -e .

      - name: Check the requirements in pyproject.toml accept the constrained versions
        run: uv pip check

      - name: Run tests
        run: .venv/bin/python -m pytest tests -v

  lowest-direct:
    name: Lowest direct dependencies (Python 3.10)
    needs: [changes]
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — https://github.com/actions/checkout/releases/tag/v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 — https://github.com/actions/setup-python/releases/tag/v7.0.0
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 — https://github.com/astral-sh/setup-uv/releases/tag/v10.2.0

      - name: Install the lowest allowed versions
        run: uv sync --resolution lowest-direct --group dev --python 3.10

      - name: Show the installed versions
        run: uv pip list

      - name: Run unit tests
        run: uv run --no-sync pytest tests/unit -v

  smoke-test:
    name: Smoke Test (base install)
    needs: [changes]
    if: needs.changes.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    # Airflow validates get_provider_info whenever it is imported; an invalid
    # one breaks `import airflow` for every installation that has this package.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — https://github.com/actions/checkout/releases/tag/v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 — https://github.com/actions/setup-python/releases/tag/v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 — https://github.com/astral-sh/setup-uv/releases/tag/v10.2.0

      - name: Install the base package only
        run: uv sync --locked --no-default-groups

      - name: Smoke import
        run: uv run --no-sync python dev/smoke.py

  integration-test:
    name: Integration Test (pixi ${{ matrix.pixi-version }})
    needs: [changes]
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pixi-version: [v0.81.0, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — https://github.com/actions/checkout/releases/tag/v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 — https://github.com/actions/setup-python/releases/tag/v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 — https://github.com/astral-sh/setup-uv/releases/tag/v10.2.0

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Install pixi
        uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0 — https://github.com/prefix-dev/setup-pixi/releases/tag/v0.11.0
        with:
          pixi-version: ${{ matrix.pixi-version }}
          run-install: false

      - name: Run integration tests
        env:
          PIXI_INTEGRATION_TEST: "1"
        run: uv run --no-sync pytest tests/integration -v

  system-test:
    name: System Test (Airflow dag.test)
    needs: [changes]
    if: needs.changes.outputs.system == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — https://github.com/actions/checkout/releases/tag/v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 — https://github.com/actions/setup-python/releases/tag/v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 — https://github.com/astral-sh/setup-uv/releases/tag/v10.2.0

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Install pixi
        uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0 — https://github.com/prefix-dev/setup-pixi/releases/tag/v0.11.0
        with:
          pixi-version: v0.81.0
          run-install: false

      - name: Init Airflow DB
        env:
          AIRFLOW_HOME: ${{ runner.temp }}/airflow
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
          AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/tests/system/pixi
        run: uv run --no-sync airflow db migrate

      - name: Run system tests
        env:
          AIRFLOW_HOME: ${{ runner.temp }}/airflow
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
          AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/tests/system/pixi
          PIXI_E2E_TEST: "1"
        run: uv run --no-sync pytest tests/system/pixi -v

  package:
    name: Build & Check Package
    needs: [changes]
    if: needs.changes.outputs.package == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 — https://github.com/actions/setup-python/releases/tag/v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 — https://github.com/astral-sh/setup-uv/releases/tag/v10.2.0

      - name: Build package
        run: uv build

      - name: Check package
        # twine < 7 rejects newer Metadata-Version values that PyPI accepts.
        run: |
          pip install 'twine>=7.0.0'
          twine check dist/*

  # The required check: skipped jobs pass, failed or cancelled ones fail it.
  result:
    name: QA result
    needs: [changes, lint, test, compat, lowest-direct, smoke-test, integration-test, system-test, package]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the job results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then exit 1; fi
