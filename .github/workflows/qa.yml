name: QA Check

on:
  push:
    branches: [main]
  # No paths filter: these jobs are required status checks on main, and a
  # filtered-out PR would wait on them forever.
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION_DEFAULT: "3.14"

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — https://github.com/actions/checkout/releases/tag/v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 — https://github.com/actions/setup-python/releases/tag/v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 — https://github.com/astral-sh/setup-uv/releases/tag/v10.2.0

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run ruff linter
        run: uv run ruff check src tests dev --output-format=github

      - name: Run ruff format check
        run: uv run ruff format src tests dev --check

      - name: Type check the runtime
        run: uv run mypy

  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # requires-python is >=3.10, so the oldest supported version is exercised too.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # Airflow does not support Windows, so macOS is the only extra platform.
          - os: macos-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — https://github.com/actions/checkout/releases/tag/v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 — https://github.com/actions/setup-python/releases/tag/v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 — https://github.com/astral-sh/setup-uv/releases/tag/v10.2.0

      - name: Install dependencies
        run: uv sync --locked --group dev --python ${{ matrix.python-version }}

      - name: Run unit tests with coverage
        run: uv run pytest tests/unit -v --cov=src/airflow/providers/pixi --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1 — https://github.com/codecov/codecov-action/releases/tag/v7.1.1
        with:
          files: coverage.xml
          fail_ci_if_error: false
          verbose: true

  compat:
    name: Airflow ${{ matrix.airflow-version }} (official constraints)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        airflow-version: ["3.1.8", "3.2.2", "3.3.2"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — https://github.com/actions/checkout/releases/tag/v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 — https://github.com/actions/setup-python/releases/tag/v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 — https://github.com/astral-sh/setup-uv/releases/tag/v10.2.0

      - name: Install Airflow with its constraints
        env:
          AIRFLOW_VERSION: ${{ matrix.airflow-version }}
        run: |
          uv venv --python 3.12
          uv pip install "apache-airflow==${AIRFLOW_VERSION}" apache-airflow-providers-standard \
            apache-airflow-providers-cncf-kubernetes apache-airflow-providers-common-compat \
            pytest pyyaml jsonschema tomlkit "packaging>=22" \
            -c "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-3.12.txt"
          uv pip install --no-deps -e .

      - name: Check the requirements in pyproject.toml accept the constrained versions
        run: uv pip check

      - name: Run tests
        run: .venv/bin/python -m pytest tests -v

  lowest-direct:
    name: Lowest direct dependencies (Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — https://github.com/actions/checkout/releases/tag/v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 — https://github.com/actions/setup-python/releases/tag/v7.0.0
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 — https://github.com/astral-sh/setup-uv/releases/tag/v10.2.0

      - name: Install the lowest allowed versions
        run: uv sync --resolution lowest-direct --group dev --python 3.10

      - name: Show the installed versions
        run: uv pip list

      - name: Run unit tests
        run: uv run --no-sync pytest tests/unit -v

  smoke-test:
    name: Smoke Test (base install)
    runs-on: ubuntu-latest
    # Airflow validates get_provider_info whenever it is imported; an invalid
    # one breaks `import airflow` for every installation that has this package.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — https://github.com/actions/checkout/releases/tag/v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 — https://github.com/actions/setup-python/releases/tag/v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 — https://github.com/astral-sh/setup-uv/releases/tag/v10.2.0

      - name: Install the base package only
        run: uv sync --locked --no-default-groups

      - name: Smoke import
        run: uv run --no-sync python dev/smoke.py

  integration-test:
    name: Integration Test (pixi ${{ matrix.pixi-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pixi-version: [v0.81.0, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — https://github.com/actions/checkout/releases/tag/v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 — https://github.com/actions/setup-python/releases/tag/v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 — https://github.com/astral-sh/setup-uv/releases/tag/v10.2.0

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Install pixi
        env:
          PIXI_VERSION: ${{ matrix.pixi-version }}
          PIXI_NO_PATH_UPDATE: "1"
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

      - name: Run integration tests
        env:
          PIXI_INTEGRATION_TEST: "1"
        run: uv run --no-sync pytest tests/integration -v

  system-test:
    name: System Test (Airflow dag.test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — https://github.com/actions/checkout/releases/tag/v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 — https://github.com/actions/setup-python/releases/tag/v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 — https://github.com/astral-sh/setup-uv/releases/tag/v10.2.0

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Install pixi
        env:
          PIXI_VERSION: v0.81.0
          PIXI_NO_PATH_UPDATE: "1"
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

      - name: Init Airflow DB
        env:
          AIRFLOW_HOME: ${{ runner.temp }}/airflow
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
          AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/tests/system/pixi
        run: uv run --no-sync airflow db migrate

      - name: Run system tests
        env:
          AIRFLOW_HOME: ${{ runner.temp }}/airflow
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
          AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/tests/system/pixi
          PIXI_E2E_TEST: "1"
        run: uv run --no-sync pytest tests/system/pixi -v

  package:
    name: Build & Check Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 — https://github.com/actions/setup-python/releases/tag/v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 — https://github.com/astral-sh/setup-uv/releases/tag/v10.2.0

      - name: Build package
        run: uv build

      - name: Check package
        # twine < 7 rejects newer Metadata-Version values that PyPI accepts.
        run: |
          pip install 'twine>=7.0.0'
          twine check dist/*
