# CI: lint, typecheck, test on push and PR
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check airflow_providers_pixi tests

      - name: Ruff (format check)
        run: ruff format --check airflow_providers_pixi tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install -e ".[dev]"

      - name: Pyright
        run: pyright airflow_providers_pixi tests

      - name: Mypy
        run: mypy airflow_providers_pixi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --cov=airflow_providers_pixi --cov-report=xml

      - name: Upload coverage (optional)
        uses: codecov/codecov-action@v4
        if: always()
        with:
          fail_ci_if_error: false
