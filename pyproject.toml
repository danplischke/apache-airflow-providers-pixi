[build-system]
requires = ["hatchling>=1.30", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

[project]
name = "apache-airflow-providers-pixi"
dynamic = ["version"]
description = "Apache Airflow 3 provider to run Python callables in Pixi environments (PixiOperator and @task.pixi)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dan Plischke" }]
keywords = ["airflow-provider", "pixi", "conda", "airflow", "integration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Framework :: Apache Airflow",
    "Framework :: Apache Airflow :: Provider",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.10,!=3.15"
import-names = ["airflow.providers.pixi"]
import-namespaces = ["airflow", "airflow.providers"]
dependencies = [
    "apache-airflow>=3.1.2",
    "apache-airflow-providers-standard>=1.9.1",
    "packaging>=22",
    "tomlkit>=0.12",
]

[project.optional-dependencies]
"cncf.kubernetes" = [
    "apache-airflow-providers-cncf-kubernetes>=10.9.0",
]

[dependency-groups]
dev = [
    "apache-airflow-providers-pixi[cncf.kubernetes]",
    "jsonschema>=4.19.1",
    "pre-commit>=3.5",
    "pytest>=7.0",
    "mypy>=1.11",
    "pytest-cov>=4.0",
    "ruff>=0.8",
]
docs = [
    "mkdocstrings-python>=2.0",
    "ruff>=0.8",
    "zensical>=0.0.69; python_version >= '3.11'",
]

[project.urls]
Documentation = "https://danplischke.github.io/apache-airflow-providers-pixi/"
"Source Code" = "https://github.com/danplischke/apache-airflow-providers-pixi"
"Bug Tracker" = "https://github.com/danplischke/apache-airflow-providers-pixi/issues"

[project.entry-points."apache_airflow_provider"]
provider_info = "airflow.providers.pixi.get_provider_info:get_provider_info"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
only-include = ["src/airflow/providers/pixi"]
sources = ["src"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/airflow/providers/pixi",
    "tests",
    "provider.yaml",
    ".github/workflows/qa.yml",
    "docs/changelog.md",
    "dev/dags",
]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.mypy]
files = ["src/airflow/providers/pixi/runtime"]
mypy_path = "src"
explicit_package_bases = true
strict = true
python_version = "3.10"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"src/airflow/providers/pixi/runtime/runner.py" = ["S102", "BLE001"]

[tool.ruff.lint.isort]
known-first-party = ["airflow.providers.pixi"]
