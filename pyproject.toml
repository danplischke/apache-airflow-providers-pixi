[build-system]
requires = ["flit_core>=3.12,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "pixi-airflow"
version = "0.1.0"
description = "Apache Airflow 3 provider to run Python callables in Pixi environments (PixiOperator and @task.pixi)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Dan Plischke" }]
keywords = ["airflow-provider", "pixi", "conda", "airflow", "integration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Framework :: Apache Airflow",
    "Framework :: Apache Airflow :: Provider",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.10"
dependencies = [
    "apache-airflow>=3.0",
]

[dependency-groups]
dev = [
    "pre-commit>=3.5",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.8",
]

[project.urls]
"Source Code" = "https://github.com/danplischke/apache-airflow-providers-pixi"
"Bug Tracker" = "https://github.com/danplischke/apache-airflow-providers-pixi/issues"

[project.entry-points."apache_airflow_provider"]
provider_info = "airflow.providers.pixi.get_provider_info:get_provider_info"

[tool.flit.module]
name = "airflow.providers.pixi"

[tool.flit.sdist]
include = [
    "provider.yaml",
    "tests/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py310"
