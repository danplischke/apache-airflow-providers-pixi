[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apache-airflow-providers-pixi"
version = "0.1.0"
description = "Apache Airflow 3 provider to run Python callables in Pixi environments (PixiOperator and @task.pixi)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Provider Author" }]
keywords = ["airflow", "airflow-provider", "pixi", "conda"]
classifiers = [
    "Framework :: Apache Airflow",
    "Framework :: Apache Airflow :: Provider",
]

dependencies = [
    "apache-airflow>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pre-commit>=3.0",
    "ruff>=0.8",
    "pyright>=1.1",
    "mypy>=1.0",
]

[project.entry-points."apache_airflow_provider"]
provider_info = "airflow_providers_pixi.get_provider_info:get_provider_info"

[tool.setuptools.packages.find]
where = ["."]
include = ["airflow_providers_pixi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".venv", "dist", "build", "__pycache__"]
src = ["airflow_providers_pixi", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
plugins = []

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
extraPaths = ["."]
