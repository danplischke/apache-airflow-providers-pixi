---
package-name: apache-airflow-providers-pixi
name: Pixi
description: |
  Run Python callables inside `Pixi <https://pixi.sh>`__ environments.

versions:
  - 0.1.0

integrations:
  - integration-name: Pixi
    external-doc-url: https://pixi.sh
    tags: [software]

operators:
  - integration-name: Pixi
    python-modules:
      - airflow.providers.pixi.operators.pixi

task-decorators:
  - name: pixi
    class-name: airflow.providers.pixi.decorators.pixi.pixi_task
