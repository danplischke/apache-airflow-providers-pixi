# See https://pre-commit.com for usage. Install with: uv run pre-commit install
# Mirrors the ruff + uv checks run in .github/workflows/qa.yml.
default_language_version:
  python: python3

exclude: ^src/airflow/providers/pixi/utils/pixi_manifest\.schema\.json$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --group dev ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --group dev ruff format
        language: system
        types_or: [python, pyi]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.23
    hooks:
      - id: uv-lock
